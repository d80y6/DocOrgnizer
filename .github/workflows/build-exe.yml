name: Build Windows Executable

on:
  push:
    tags:
      - 'v*' # يبدأ البناء التلقائي عند رفع Tag جديد

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate Icon Automatically
      run: |
        python -c "
        from PIL import Image, ImageDraw, ImageFont
        img = Image.new('RGBA', (256, 256), color=(33, 150, 243, 255))
        d = ImageDraw.Draw(img)
        try:
            font = ImageFont.truetype('arial.bd.ttf', 120)
            d.text((85, 50), 'D', fill=(255, 255, 255, 255), font=font)
        except:
            pass
        img.save('icon.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (32, 32), (16, 16)])
        print('Icon generated successfully!')
        "

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --icon=icon.ico --name="SmartDocOrganizer" app.py

    - name: Create GitHub Release and Upload Exe
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/SmartDocOrganizer.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
